<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&amp;family=Playfair+Display:ital,wght@0,600;1,500&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Daftar — Clamfy Wellness</title>
</head>
<body class="auth-body">
<div class="sky" aria-hidden="true"><span class="cloud c1"></span><span class="cloud c2"></span></div>
<main class="auth">
    <form class="glass auth-card" method="post" th:action="@{/register}">
        <a class="brand" th:href="@{/}">☁ clamfy<span>.</span></a>
        <h2>Mulai hidup <em>lebih sehat</em></h2>
        <p class="err" th:if="${error}" th:text="${error}"></p>
        <label>Nama<input type="text" name="nama" required></label>
        <label>Email<input type="email" name="email" required></label>
        <label>Password (min. 6 karakter)<input type="password" name="password" minlength="6" required></label>
        <button class="btn" type="submit">Buat Akun</button>
        <p class="alt">Sudah punya akun? <a th:href="@{/login}">Masuk</a></p>
    </form>
</main>
</body>
</html>

spring.application.name=smarthealthy
server.port=${PORT:8080}

# Lokal (XAMPP/Laragon) memakai nilai bawaan di kanan tanda titik dua.
# Saat online (Railway), nilainya diambil dari environment variables.
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:smart_healthy}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&serverTimezone=Asia/Jakarta
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Supaya tetap login di balik proxy/HTTPS hosting
server.forward-headers-strategy=framework
